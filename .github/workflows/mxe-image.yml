# Builds the MXE cross-compile image (mxe/Dockerfile) on a GitHub-hosted runner and caches it in GHCR as
# ghcr.io/<owner>/mxe-libarchive:mxe-<tree hash of mxe/>. If that tag already exists the build is skipped,
# so MXE is built once per change to mxe/, not once per libarchive build. build-libarchive.yml calls this
# workflow first; it can also be run by hand, with force to rebuild an existing tag.
name: MXE image

on:
  workflow_call:
    inputs:
      force:
        description: Rebuild and push even if the tag already exists.
        type: boolean
        default: false
    outputs:
      image:
        description: The GHCR reference of the MXE image for this commit's mxe/ folder.
        value: ${{ jobs.image.outputs.image }}
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and push even if the tag already exists.
        type: boolean
        default: false

permissions: {}

# bash -eo pipefail, so a failure inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-latest
    # MXE builds GCC and every dependency for two targets: about an hour (56 minutes on the first run).
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    # One MXE build at a time per repo; a second caller waits, then finds the tag and skips.
    concurrency:
      group: mxe-image-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Work out the image tag
        id: tag
        run: |
          image=$(scripts/mxe-image-tag.sh)
          echo "image=${image}" >>"${GITHUB_OUTPUT}"
          echo "MXE image: ${image}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin

      - name: Check whether the image exists
        id: exists
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          FORCE: ${{ inputs.force }}
        run: |
          if [[ ${FORCE} != true ]] && docker manifest inspect "${IMAGE}" >/dev/null 2>&1; then
            echo "exists=true" >>"${GITHUB_OUTPUT}"
            echo "${IMAGE} is already in GHCR; skipping the build." | tee -a "${GITHUB_STEP_SUMMARY}"
          else
            echo "exists=false" >>"${GITHUB_OUTPUT}"
          fi

      - name: Free disk space
        if: steps.exists.outputs.exists != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - name: Build the MXE image
        if: steps.exists.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          start=$(date +%s)
          docker build --progress plain --tag "${IMAGE}" mxe 2>&1 | tee "${RUNNER_TEMP}/mxe-build.log"
          echo "Built in $(( ($(date +%s) - start) / 60 )) minutes." | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Check the toolchain
        if: steps.exists.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker run --rm "${IMAGE}" bash -euo pipefail -c '
            cd "$(mktemp -d)"
            printf "#include <stdio.h>\nint main(void){puts(\"hi\");return 0;}\n" >hello.c
            for t in x86_64-w64-mingw32.static x86_64-w64-mingw32.shared; do
              "${t}-gcc" -O2 -o "hello-${t}.exe" hello.c
              file "hello-${t}.exe"
              command -v "${t}-cmake"
              for p in zlib bzip2 liblzma liblz4 libzstd libcrypto libxml-2.0 expat pcre2-posix; do
                printf "%s %s %s\n" "${t}" "${p}" "$("${t}-pkg-config" --modversion "${p}" 2>/dev/null || echo "no .pc file")"
              done
            done
            cat /opt/mxe/mxe-info.json
            ls /opt/mxe/licenses /opt/mxe/sources
            du -sh /opt/mxe
          ' | tee -a "${GITHUB_STEP_SUMMARY}"
          docker image ls "${IMAGE}"

      - name: Push the MXE image
        if: steps.exists.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: docker push "${IMAGE}"

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mxe-build-log
          path: ${{ runner.temp }}/mxe-build.log
          if-no-files-found: ignore
