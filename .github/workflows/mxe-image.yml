# Builds the MXE cross-compile image (mxe/Dockerfile) on a GitHub-hosted runner and pushes it to GHCR as
# ghcr.io/<owner>/mxe-libarchive:sha-<commit>, and also as :latest when it builds the default branch.
# build-libarchive.yml never builds MXE: it pulls :latest, or the sha-<commit> tag a manual run names.
#
# Runs weekly (so the image picks up Ubuntu's security updates), on a push to the default branch that
# changes mxe/, and by hand on any branch. A run on another branch pushes only its sha-<commit> tag, so a
# Dockerfile change can be tried with build-libarchive.yml's mxe_image_commit input before it merges.
name: MXE image

on:
  schedule:
    - cron: '17 3 * * 0'
  push:
    branches: [main]
    paths:
      - mxe/**
      - .github/workflows/mxe-image.yml
  workflow_dispatch:

permissions: {}

# One MXE build at a time per repo; a second run waits rather than racing the first to :latest.
concurrency:
  group: mxe-image
  cancel-in-progress: false

# bash -eo pipefail, so a failure inside a pipeline fails the step.
defaults:
  run:
    shell: bash

jobs:
  image:
    runs-on: ubuntu-latest
    # MXE builds GCC and every dependency for two targets: about an hour (56 minutes on the first run).
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Work out the image tags
        id: tag
        env:
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          image=$(scripts/mxe-image-tag.sh "${GITHUB_SHA}")
          latest=
          if [[ ${REF} == "${DEFAULT_REF}" ]]; then
            latest=$(scripts/mxe-image-tag.sh)
          else
            echo "::notice::${REF} is not the default branch, so :latest is left alone."
          fi
          echo "image=${image}" >>"${GITHUB_OUTPUT}"
          echo "latest=${latest}" >>"${GITHUB_OUTPUT}"
          echo "MXE image: ${image}${latest:+ and ${latest}}" >>"${GITHUB_STEP_SUMMARY}"

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io --username "${ACTOR}" --password-stdin

      # A seconds-long push of a tiny image to the same package, so a GHCR permission problem fails here
      # rather than after the hour-long build. The label links a new package to this repository.
      - name: Check GHCR push access
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          check="${IMAGE%:*}:push-check"
          dir=$(mktemp -d)
          printf 'push check\n' >"${dir}/push-check.txt"
          printf 'FROM scratch\nCOPY push-check.txt /\nLABEL org.opencontainers.image.source="%s"\n' "${SOURCE}" >"${dir}/Dockerfile"
          docker build --quiet --provenance=false --sbom=false --tag "${check}" "${dir}"
          if ! docker push --quiet "${check}"; then
            echo "::error::GHCR refused a push to ${check%:*}. If that package already exists, open its settings on GitHub (Packages), and under Manage Actions access add this repository with the Write role, or delete the package so the workflow can create it."
            exit 1
          fi

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      # --pull refreshes the digest-pinned base only if the pin changed; --no-cache makes the weekly
      # run take Ubuntu's current packages instead of a cached apt layer.
      - name: Build the MXE image
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          start=$(date +%s)
          docker build --progress plain --provenance=false --sbom=false --no-cache --pull \
            --label "org.opencontainers.image.source=${SOURCE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --tag "${IMAGE}" mxe 2>&1 | tee "${RUNNER_TEMP}/mxe-build.log"
          echo "Built in $(( ($(date +%s) - start) / 60 )) minutes." | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Check the toolchain
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          docker run --rm "${IMAGE}" bash -euo pipefail -c '
            cd "$(mktemp -d)"
            printf "#include <stdio.h>\nint main(void){puts(\"hi\");return 0;}\n" >hello.c
            for t in x86_64-w64-mingw32.static x86_64-w64-mingw32.shared; do
              "${t}-gcc" -O2 -o "hello-${t}.exe" hello.c
              file "hello-${t}.exe"
              command -v "${t}-cmake"
              for p in zlib bzip2 liblzma liblz4 libzstd libcrypto libxml-2.0 expat pcre2-posix; do
                printf "%s %s %s\n" "${t}" "${p}" "$("${t}-pkg-config" --modversion "${p}" 2>/dev/null || echo "no .pc file")"
              done
            done
            cat /opt/mxe/mxe-info.json
            ls /opt/mxe/licenses /opt/mxe/sources
            du -sh /opt/mxe
          ' | tee -a "${GITHUB_STEP_SUMMARY}"
          docker image ls "${IMAGE}"

      # :latest moves only after the sha- tag is pushed and the toolchain check has passed.
      - name: Push the MXE image
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          docker push "${IMAGE}"
          if [[ -n ${LATEST} ]]; then
            docker tag "${IMAGE}" "${LATEST}"
            docker push "${LATEST}"
          fi
          docker logout ghcr.io

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mxe-build-log
          path: ${{ runner.temp }}/mxe-build.log
          if-no-files-found: ignore
