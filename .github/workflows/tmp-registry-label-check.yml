# Temporary: reproduces the nanoserver-base schedule failure and checks the fix. Removed before merging.
name: TMP registry label check
on:
  push:
    branches: [claude/focused-fermi-9c6rb5]
    paths: [.github/workflows/tmp-registry-label-check.yml, scripts/Get-RegistryImageLabel.ps1]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Old script (main), which the schedule runs
        shell: pwsh
        continue-on-error: true
        run: |
          git show origin/main:scripts/Get-RegistryImageLabel.ps1 | Set-Content old.ps1
          "PowerShell $($PSVersionTable.PSVersion)"
          $t = (Invoke-RestMethod -Uri 'https://auth.docker.io/token?service=registry.docker.io&scope=repository:zippy1981/nanoserver-base:pull').token
          $m = Invoke-WebRequest -Uri 'https://registry-1.docker.io/v2/zippy1981/nanoserver-base/manifests/ltsc2025' -Headers @{ Authorization = "Bearer $t"; Accept = 'application/vnd.docker.distribution.manifest.v2+json' }
          "Manifest Content-Type: $($m.Headers['Content-Type']); .Content is $($m.Content.GetType().FullName)"
          ./old.ps1 -Repository zippy1981/nanoserver-base -Tag ltsc2025
      - name: New script
        shell: pwsh
        run: |
          foreach ($tag in 'ltsc2019', 'ltsc2022', 'ltsc2025') {
            $labels = ./scripts/Get-RegistryImageLabel.ps1 -Repository zippy1981/nanoserver-base -Tag $tag
            if (-not $labels) { throw "no labels for $tag" }
            "$tag base.digest = $($labels['org.opencontainers.image.base.digest'])"
          }
          $missing = ./scripts/Get-RegistryImageLabel.ps1 -Repository zippy1981/nanoserver-base -Tag no-such-tag
          "missing tag returns nothing: $($null -eq $missing)"
          try { ./scripts/Get-RegistryImageLabel.ps1 -Repository zippy1981/no-such-repo-xyz -Tag ltsc2025; throw 'expected an error' }
          catch { "error for a bad repository: $($_.Exception.Message)" }
